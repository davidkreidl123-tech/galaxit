<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="planet" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffd1f5"/>
      <stop offset="0.18" stop-color="#ff6ad5"/>
      <stop offset="0.55" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#140a4a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#8a7dff"/>
      <stop offset="1" stop-color="#ff5fd2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#8b5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="planetClip"><circle cx="256" cy="256" r="124"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Aura -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <g transform="rotate(-22 256 256)">
    <!-- Ring, hinterer Teil -->
    <path d="M 40 256 A 216 64 0 0 1 472 256" fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Planet -->
  <circle cx="256" cy="256" r="124" fill="url(#planet)"/>
  <g clip-path="url(#planetClip)">
    <!-- Wolkenbänder -->
    <ellipse cx="256" cy="220" rx="190" ry="16" fill="url(#band)" transform="rotate(-22 256 256)"/>
    <ellipse cx="256" cy="290" rx="190" ry="22" fill="url(#band)" transform="rotate(-22 256 256)"/>
    <!-- Terminator-Schatten -->
    <circle cx="300" cy="300" r="150" fill="#05021a" opacity="0.28"/>
  </g>
  <!-- "G" als leuchtender Lichtschnitt -->
  <path d="M 318 214 A 74 74 0 1 0 330 268 L 262 268" fill="none" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <path d="M 318 214 A 74 74 0 1 0 330 268 L 262 268" fill="none" stroke="#ffffff"
        stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="rotate(-22 256 256)">
    <!-- Ring, vorderer Teil -->
    <path d="M 472 256 A 216 64 0 0 1 40 256" fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 472 256 A 216 64 0 0 1 40 256" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.5" filter="url(#soft)"/>
    <!-- Mond auf dem Orbit -->
    <circle cx="104" cy="298" r="17" fill="#00f0ff"/>
    <circle cx="99" cy="293" r="6" fill="#e9ffff"/>
  </g>

  <!-- Funkelstern -->
  <path d="M 408 84 L 416 112 L 444 120 L 416 128 L 408 156 L 400 128 L 372 120 L 400 112 Z" fill="#ffffff"/>
  <circle cx="408" cy="120" r="14" fill="#ffffff" opacity="0.5" filter="url(#soft)"/>
  <circle cx="120" cy="120" r="4" fill="#fff" opacity="0.8"/>
  <circle cx="430" cy="380" r="3" fill="#fff" opacity="0.7"/>
  <circle cx="80" cy="410" r="2.5" fill="#fff" opacity="0.6"/>
</svg>
